<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NBA All-Time $20 Squad Builder: Full Simulation</title>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: #111a2e;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --p1: #38bdf8;
      --p2: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --badge-fit: #10b981;
      --badge-penalty: #ef4444;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 12px; }
    
    header { text-align: center; }
    h1 { font-size: 1.35rem; color: var(--accent); letter-spacing: 0.5px; }
    .subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; border: 1px solid var(--border); }

    /* Драфт-зона */
    .draft-box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .player-card {
      width: 100%;
      background: #090e1c;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 16px;
    }
    .player-name { font-size: 1.35rem; font-weight: 800; }
    .player-meta { color: var(--text-muted); font-size: 0.82rem; margin-top: 6px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .meta-tag { background: #1a253c; padding: 4px 8px; border-radius: 6px; font-weight: 600; color: #cbd5e1; }
    .meta-era-legend { background: #78350f; color: #fef08a; border: 1px solid #b45309; }
    .meta-era-modern { background: #1e3a5f; color: #93c5fd; border: 1px solid #2563eb; }

    .skip-counter {
      font-size: 0.75rem;
      color: #fb7185;
      font-weight: 600;
      background: #2b0b17;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #881337;
    }

    .bid-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-p1 { background: var(--p1); color: #082f49; }
    .btn-p2 { background: var(--p2); color: #500724; }
    .btn-skip { background: #334155; }

    /* Ростеры */
    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-card { border-top: 4px solid var(--border); }
    .team-card.p1 { border-color: var(--p1); }
    .team-card.p2 { border-color: var(--p2); }
    
    .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .team-title { font-weight: 700; font-size: 0.95rem; }
    .budget-tag { font-size: 0.8rem; background: #000; padding: 3px 7px; border-radius: 6px; font-weight: 700; }

    .slot-list { display: flex; flex-direction: column; gap: 6px; }
    .slot {
      background: #090e1c;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }
    .slot-pos { font-weight: 800; color: var(--text-muted); width: 24px; }
    .slot-info { display: flex; flex-direction: column; align-items: flex-end; max-width: 82%; }
    .slot-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-fit { font-size: 0.65rem; margin-top: 2px; }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 14px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .pos-btn-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .pos-btn { padding: 12px 0; text-align: center; font-size: 0.85rem; }
    .pos-penalty-hint { font-size: 0.62rem; display: block; font-weight: normal; opacity: 0.8; margin-top: 2px; }

    /* Результаты матча */
    .score-banner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #090e1c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .score-box { text-align: center; }
    .score-num { font-size: 2.2rem; font-weight: 900; }
    .score-p1 { color: var(--p1); }
    .score-p2 { color: var(--p2); }

    .quarter-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      text-align: center;
      margin-top: 6px;
      background: #090e1c;
      border-radius: 6px;
    }
    .quarter-table th, .quarter-table td { padding: 6px; border: 1px solid var(--border); }
    .quarter-table th { color: var(--text-muted); }

    .box-score-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; margin-top: 6px; }
    .box-score-table th, .box-score-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: center; }
    .box-score-table th:first-child, .box-score-table td:first-child { text-align: left; }
    .box-score-table th { color: var(--text-muted); }

    .team-box-header {
      font-size: 0.85rem;
      font-weight: 800;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
    }

    .narrative {
      background: #090e1c;
      border-left: 3px solid var(--accent);
      padding: 10px;
      font-size: 0.78rem;
      line-height: 1.45;
      color: #cbd5e1;
      border-radius: 4px;
    }
    .narrative h4 { color: #f8fafc; margin-bottom: 4px; font-size: 0.82rem; }

    .mvp-banner {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      background: #2b1f09;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #78350f;
    }
    .penalty-text { color: var(--badge-penalty); font-weight: 700; }
  </style>
</head>

<div class="container">
  <header>
    <h1>🏀 ALL-TIME NBA $20 DRAFT</h1>
    <p class="subtitle">Легенды & Звёзды • Скрытые рейтинги 2K • Полная статистика матча (PTS/REB/AST)</p>
  </header>

  <!-- ДРАФТ-ЗОНА -->

      </div>
    </div>

    <div>
      <span class="skip-counter" id="skipCounterDisplay">Сбросов осталось: 4 / 4</span>
    </div>
    
    <div class="bid-controls" id="controls">
      <button id="startBtn" onclick="game.nextTurn()">Начать драфт</button>
      <div id="actionControls" style="display:none; width: 100%; flex-direction: column; gap: 8px; align-items: center;">
        <label style="font-size: 0.85rem;">Ставка ($): 
          <input type="number" id="bidAmount" value="1" min="1" max="20" style="width: 55px; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: #090e1c; color: #fff; text-align: center; font-weight: 700;">
        </label>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button class="btn-p1" onclick="game.buyPlayer(1)">Купить Игрок 1</button>
          <button class="btn-p2" onclick="game.buyPlayer(2)">Купить Игрок 2</button>
          <button class="btn-skip" id="skipBtn" onclick="game.skipPlayer()">Сброс игрока</button>
        </div>
      </div>
    </div>
  </section>

  <!-- РОСТЕРЫ КОМАНД -->
  <section class="teams-grid">
    <div class="card team-card p1">
      <div class="team-header">
        <span class="team-title" style="color:var(--p1)">Игрок 1</span>
        <span class="budget-tag" id="p1Budget">$20</span>
      </div>
      <div class="slot-list" id="p1Slots"></div>
    </div>

    <div class="card team-card p2">
      <div class="team-header">
        <span class="team-title" style="color:var(--p2)">Игрок 2</span>
        <span class="budget-tag" id="p2Budget">$20</span>
      </div>
      <div class="slot-list" id="p2Slots"></div>
    </div>
  </section>
</div>

<!-- МОДАЛ ВЫБОРА ПОЗИЦИИ -->
<div class="modal" id="posModal">
  <div class="modal-content">
    <h3 style="font-size:1.05rem;">Выберите позицию в пятерке</h3>
    <p style="font-size: 0.8rem; color: var(--text-muted);" id="posPromptPlayer"></p>
    <div class="pos-btn-group" id="posButtons"></div>
  </div>
</div>

<!-- МОДАЛ ФИНАЛА И ИТОГОВ МАТЧА -->
<div class="modal" id="finishModal">
  <div class="modal-content">
    <h2 style="text-align: center; font-size: 1.2rem;">РЕЗУЛЬТАТЫ СИМУЛЯЦИИ МАТЧА</h2>
    
    <div class="score-banner">
      <div class="score-box">
        <div style="font-weight: 700; color: var(--p1); font-size: 0.85rem;">Игрок 1</div>
        <div class="score-num score-p1" id="p1Points">0</div>
      </div>
      <div style="font-size: 1.2rem; font-weight: 900; color: var(--text-muted);">FINAL</div>
      <div class="score-box">
        <div style="font-weight: 700; color: var(--p2); font-size: 0.85rem;">Игрок 2</div>
        <div class="score-num score-p2" id="p2Points">0</div>
      </div>
    </div>

    <div id="quarterScoreTable"></div>

    <div class="mvp-banner" id="mvpBanner"></div>
    
    <div id="matchStoryBox" class="narrative"></div>
    <div id="narrativeBox" class="narrative"></div>
    
    <!-- Полная индивидуальная статистика -->
    <div id="detailedBoxScores"></div>

    <button onclick="location.reload()" style="margin-top: 8px; width: 100%;">Сыграть заново</button>
  </div>
</div>

const POSITIONS = ["PG", "SG", "SF", "PF", "C"];

function calculateFit(player, targetPos) {
  if (player.pos === targetPos) {
    return { status: "PERFECT", penalty: 0, text: "Родная позиция" };
  }
  if (player.sec && player.sec.includes(targetPos)) {
    return { status: "SECONDARY", penalty: 3, text: "Вторая позиция (-3 очка)" };
  }
  const posOrder = { PG: 1, SG: 2, SF: 3, PF: 4, C: 5 };
  const diff = Math.abs(posOrder[player.pos] - posOrder[targetPos]);
  const penalty = diff * 5; 
  return { status: "OUT_OF_POS", penalty, text: `Чужая позиция (-${penalty} штраф)` };
}

class FullMatchEngine {
  constructor() {
    this.deck = [...ALL_PLAYERS].sort(() => Math.random() - 0.5);
    this.currentPlayer = null;
    this.skipsLeft = 4;
    this.p1 = { budget: 20, roster: { PG: null, SG: null, SF: null, PF: null, C: null } };
    this.p2 = { budget: 20, roster: { PG: null, SG: null, SF: null, PF: null, C: null } };
    this.buyerPending = null;
    this.initSlots();
    this.updateSkipUI();
  }

  initSlots() {
    ['p1', 'p2'].forEach(p => {
      const container = document.getElementById(`${p}Slots`);
      container.innerHTML = '';
      POSITIONS.forEach(pos => {
        container.innerHTML += `
          <div class="slot" id="${p}_${pos}">
            <span class="slot-pos">${pos}</span>
            <div class="slot-info">
              <span class="slot-name">- пусто -</span>
              <span class="slot-fit"></span>
            </div>
          </div>`;
      });
    });
  }

  updateSkipUI() {
    const disp = document.getElementById('skipCounterDisplay');
    const btn = document.getElementById('skipBtn');
    disp.innerText = `Сбросов осталось: ${this.skipsLeft} / 4`;
    if (this.skipsLeft <= 0) {
      if (btn) btn.disabled = true;
      disp.style.color = '#ef4444';
      disp.innerText = `Сбросов не осталось (0 / 4)`;
    }
  }

  isTeamFull(playerNum) {
    const r = playerNum === 1 ? this.p1.roster : this.p2.roster;
    return Object.values(r).every(x => x !== null);
  }

  nextTurn() {
    if (this.isTeamFull(1) && this.isTeamFull(2)) {
      this.simulateMatch();
      return;
    }

    if (this.deck.length === 0) {
      alert("Все игроки разобраны!");
      this.simulateMatch();
      return;
    }

    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('actionControls').style.display = 'flex';

    this.currentPlayer = this.deck.pop();
    document.getElementById('currentName').innerText = this.currentPlayer.name;
    
    const eraClass = this.currentPlayer.era === 'legend' ? 'meta-era-legend' : 'meta-era-modern';
    const eraText = this.currentPlayer.era === 'legend' ? '⭐ Легенда NBA' : '🔥 Действующая звезда';
    const secondaries = this.currentPlayer.sec.length ? ` / ${this.currentPlayer.sec.join('/')}` : '';

    document.getElementById('currentMeta').innerHTML = `
      <span class="meta-tag ${eraClass}">${eraText}</span>
      <span class="meta-tag">Позиция: ${this.currentPlayer.pos}${secondaries}</span>
      <span class="meta-tag" style="background:#221526; color:#e9d5ff;">2K OVR: 🔒 Скрыто</span>
    `;
  }

  skipPlayer() {
    if (this.skipsLeft <= 0) {
      alert("Лимит сбросов исчерпан (максимум 4 за игру)!");
      return;
    }
    this.skipsLeft--;
    this.updateSkipUI();
    this.nextTurn();
  }

  buyPlayer(playerNum) {
    const cost = parseInt(document.getElementById('bidAmount').value) || 1;
    const team = playerNum === 1 ? this.p1 : this.p2;

    if (this.isTeamFull(playerNum)) {
      alert(`У Игрока ${playerNum} уже полностью укомплектована стартовая пятерка!`);
      return;
    }
    if (team.budget < cost) {
      alert(`Не хватает бюджета! Доступно: $${team.budget}`);
      return;
    }

    team.budget -= cost;
    document.getElementById(`p${playerNum}Budget`).innerText = `$${team.budget}`;

    this.buyerPending = { playerNum, cost };
    this.openPositionModal(playerNum);
  }

  openPositionModal(playerNum) {
    const roster = playerNum === 1 ? this.p1.roster : this.p2.roster;
    const container = document.getElementById('posButtons');
    container.innerHTML = '';

    document.getElementById('posPromptPlayer').innerText = 
      `${this.currentPlayer.name} (Основная: ${this.currentPlayer.pos})`;

    POSITIONS.forEach(pos => {
      const isOccupied = roster[pos] !== null;
      const fit = calculateFit(this.currentPlayer, pos);

      const btn = document.createElement('button');
      btn.className = 'pos-btn';
      btn.disabled = isOccupied;
      
      let badge = fit.penalty === 0 ? "★ Родная" : `-${fit.penalty} штраф`;
      btn.innerHTML = `<b>${pos}</b><span class="pos-penalty-hint">${badge}</span>`;
      btn.onclick = () => this.assignPosition(pos, fit);
      container.appendChild(btn);
    });

    document.getElementById('posModal').classList.add('active');
  }

  assignPosition(pos, fit) {
    const { playerNum } = this.buyerPending;
    const roster = playerNum === 1 ? this.p1.roster : this.p2.roster;
    
    roster[pos] = {
      ...this.currentPlayer,
      fitPenalty: fit.penalty,
      fitStatus: fit.status,
      assignedPos: pos
    };
    
    const slotEl = document.querySelector(`#p${playerNum}_${pos}`);
    const nameEl = slotEl.querySelector('.slot-name');
    const fitEl = slotEl.querySelector('.slot-fit');

    nameEl.innerText = this.currentPlayer.name;
    nameEl.style.color = '#38bdf8';

    if (fit.penalty === 0) {
      fitEl.innerText = "✓ Родная";
      fitEl.style.color = "var(--badge-fit)";
    } else {
      fitEl.innerText = `⚠ Штраф: -${fit.penalty}`;
      fitEl.style.color = "var(--badge-penalty)";
    }

    document.getElementById('posModal').classList.remove('active');
    this.nextTurn();
  }

  // Расчёт индивидуальной статистики игроков
  generatePlayerStats(p, teamPoints, teamRebs, teamAssists) {
    const effOff = Math.max(30, p.off - p.fitPenalty * 1.5);
    const effReb = Math.max(20, p.reb - (p.assignedPos === 'C' && p.pos !== 'C' ? 15 : 0));
    const effPlay = Math.max(30, p.play - (p.assignedPos === 'PG' && p.pos !== 'PG' ? 20 : 0));

    // Очки пропорционально атакующему весу + КПД
    const ptsWeight = (effOff * 1.3) + (p.per * 1.8);
    const rebWeight = effReb * 2.0;
    const astWeight = effPlay * 2.0;

    return {
      player: p,
      ptsWeight,
      rebWeight,
      astWeight,
      blk: Math.max(0, Math.round((p.def / 35) * (['C', 'PF'].includes(p.assignedPos) ? 1.6 : 0.4))),
      stl: Math.max(0, Math.round((p.def / 40) * (['PG', 'SG'].includes(p.assignedPos) ? 1.4 : 0.6)))
    };
  }

  simulateMatch() {
    const getTeamTotals = (roster) => {
      let ovr = 0, off = 0, def = 0, reb = 0, play = 0, per = 0, pen = 0;
      POSITIONS.forEach(pos => {
        const p = roster[pos];
        ovr += p.ovr;
        off += p.off;
        def += p.def;
        reb += p.reb;
        play += p.play;
        per += p.per;
        pen += p.fitPenalty;
      });
      return { ovr, off, def, reb, play, per, pen };
    };

    const t1 = getTeamTotals(this.p1.roster);
    const t2 = getTeamTotals(this.p2.roster);

    // Расчет четвертей с реальной баскетбольной флуктуацией
    let q1 = [], q2 = [];
    let p1Total = 0, p2Total = 0;

    for (let i = 0; i < 4; i++) {
      // Базовая результативность четверти ~ 24-32 очков
      let qBase1 = 26 + (t1.off / 5 - 85) * 0.35 - (t2.def / 5 - 85) * 0.25 - (t1.pen * 0.22);
      let qBase2 = 26 + (t2.off / 5 - 85) * 0.35 - (t1.def / 5 - 85) * 0.25 - (t2.pen * 0.22);

      // Случайный фактор четверти (-4..+4 очка)
      let noise1 = Math.floor(Math.random() * 9) - 4;
      let noise2 = Math.floor(Math.random() * 9) - 4;

      let score1 = Math.max(16, Math.round(qBase1 + noise1));
      let score2 = Math.max(16, Math.round(qBase2 + noise2));

      q1.push(score1);
      q2.push(score2);
      p1Total += score1;
      p2Total += score2;
    }

    // Если ничья после 4 четвертей — овертайм (OT)
    let ot1 = 0, ot2 = 0;
    if (p1Total === p2Total) {
      ot1 = Math.round(10 + Math.random() * 5);
      ot2 = ot1 + (Math.random() > 0.5 ? 2 : -2);
      p1Total += ot1;
      p2Total += ot2;
    }

    document.getElementById('p1Points').innerText = p1Total;
    document.getElementById('p2Points').innerText = p2Total;

    // Генерация таблицы четвертей
    let quarterHtml = `
      <table class="quarter-table">
        <tr><th>Команда</th><th>1-я</th><th>2-я</th><th>3-я</th><th>4-я</th>${ot1 > 0 ? '<th>OT</th>' : ''}<th>ИТОГ</th></tr>
        <tr>
          <td style="color:var(--p1); font-weight:700;">Игрок 1</td>
          <td>${q1[0]}</td><td>${q1[1]}</td><td>${q1[2]}</td><td>${q1[3]}</td>
          ${ot1 > 0 ? `<td>${ot1}</td>` : ''}
          <td><b>${p1Total}</b></td>
        </tr>
        <tr>
          <td style="color:var(--p2); font-weight:700;">Игрок 2</td>
          <td>${q2[0]}</td><td>${q2[1]}</td><td>${q2[2]}</td><td>${q2[3]}</td>
          ${ot2 > 0 ? `<td>${ot2}</td>` : ''}
          <td><b>${p2Total}</b></td>
        </tr>
      </table>
    `;
    document.getElementById('quarterScoreTable').innerHTML = quarterHtml;

    // Раскладка индивидуальной статистики
    const assignBoxScores = (roster, teamPts) => {
      const statsList = POSITIONS.map(pos => this.generatePlayerStats(roster[pos]));
      const sumPtsW = statsList.reduce((acc, s) => acc + s.ptsWeight, 0);
      const sumRebW = statsList.reduce((acc, s) => acc + s.rebWeight, 0);
      const sumAstW = statsList.reduce((acc, s) => acc + s.astWeight, 0);

      const totalTeamRebs = 42 + Math.round((statsList.reduce((a, s) => a + s.player.reb, 0) / 5 - 80) * 0.5);
      const totalTeamAst = Math.round(teamPts * 0.6);

      let allocatedPts = 0;
      let finalBoxes = statsList.map((s, idx) => {
        let pts = Math.round((s.ptsWeight / sumPtsW) * teamPts);
        let reb = Math.max(1, Math.round((s.rebWeight / sumRebW) * totalTeamRebs));
        let ast = Math.max(0, Math.round((s.astWeight / sumAstW) * totalTeamAst));
        allocatedPts += pts;
        return { ...s, pts, reb, ast };
      });

      // Калибровка суммы очков под точный командный счет
      let diffPts = teamPts - allocatedPts;
      finalBoxes[0].pts += diffPts;

      return finalBoxes;
    };

    const b1 = assignBoxScores(this.p1.roster, p1Total);
    const b2 = assignBoxScores(this.p2.roster, p2Total);

    // Определение MVP матча
    const allBox = [...b1, ...b2];
    allBox.sort((a, b) => (b.pts * 1.0 + b.reb * 1.3 + b.ast * 1.5 + b.blk * 2 + b.stl * 2) - 
                          (a.pts * 1.0 + a.reb * 1.3 + a.ast * 1.5 + a.blk * 2 + a.stl * 2));
    const mvp = allBox[0];
    const mvpOwner = b1.includes(mvp) ? "Игрок 1" : "Игрок 2";
    document.getElementById('mvpBanner').innerHTML = `
      🏆 <b>MVP МАТЧА:</b> ${mvp.player.name} (${mvpOwner})<br>
      <span style="font-size:0.75rem; color:#fde68a;">${mvp.pts} PTS • ${mvp.reb} REB • ${mvp.ast} AST • ${mvp.blk} BLK • ${mvp.stl} STL (2K: ${mvp.player.ovr})</span>
    `;

    // ХРОНИКА МАТЧА (Полная история)
    let leadQ1 = q1[0] > q2[0] ? "Игрок 1 захватил лидерство на старте благодаря быстрым отрывам" : (q2[0] > q1[0] ? "Игрок 2 увереннее вошёл в матч, сразу навязав высокий темп" : "Первая четверть прошла в абсолютно равной перестрелке очко в очко");
    
    let midGame = "";
    let half1 = q1[0] + q1[1];
    let half2 = q2[0] + q2[1];
    if (half1 > half2 + 6) {
      midGame = `К большому перерыву Игрок 1 оформил комфортный гандикап (+${half1 - half2} очков), разрывая чужую опеку.`;
    } else if (half2 > half1 + 6) {
      midGame = `Во второй четверти Игрок 2 выдал мощный рывок (+${half2 - half1} к перерыву), плотно закрыв периметр.`;
    } else {
      midGame = `К большому перерыву на табло царило равновесие (${half1}:${half2}) — ни одна команда не отпускала соперника больше чем на одно владение.`;
    }

    let clutchStory = "";
    if (p1Total > p2Total) {
      clutchStory = `🔥 <b>Клатч:</b> В 4-й четверти Игрок 1 дожал концовку. Решающие владения хладнокровно реализовал <b>${b1[0].player.name}</b>, а защита не позволила Игроку 2 провести спасительную атаку.`;
    } else {
      clutchStory = `🔥 <b>Клатч:</b> Концовка осталась за Игроком 2: ключевой перехват и хладнокровные попадания от <b>${b2[0].player.name}</b> переломили чашу весов в последние две минуты матча.`;
    }

    document.getElementById('matchStoryBox').innerHTML = `
      <h4>Хроника матча:</h4>
      • <b>Старт:</b> ${leadQ1}.<br>
      • <b>Экватор:</b> ${midGame}<br>
      • ${clutchStory}
    `;

    // ПОЛНЫЙ ДВУСТОРОННИЙ АНАЛИЗ (Игрок 1 и Игрок 2)
    let p1Pros = [], p1Cons = [];
    let p2Pros = [], p2Cons = [];

    // Анализ Игрока 1
    if (t1.pen === 0) p1Pros.push("Идеальная позиционная химия — все 5 игроков действовали на своих родных местах.");
    else if (t1.pen > 10) p1Cons.push(`Позиционный хаос (-${t1.pen} штрафа): игроки теряли позиции и уступали в скорости/габаритах.`);
    
    if (t1.reb >= t2.reb) p1Pros.push("Надёжный контроль отскока и вторых шансов на щите.");
    else p1Cons.push("Проигранная дуэль на подборах под своим кольцом.");

    if (t1.def > 90) p1Pros.push("Элитный защитный рейтинг — сопернику было тяжело атаковать из 'краски'.");
    if (t1.off < 85) p1Cons.push("Периодические застои в позиционном нападении.");

    // Анализ Игрока 2
    if (t2.pen === 0) p2Pros.push("Безупречный подбор состава по амплуа — нулевые позиционные штрафы.");
    else if (t2.pen > 10) p2Cons.push(`Ощутимый штраф за смену позиций (-${t2.pen}): провалы при сдваивании и опеке.`);

    if (t2.reb >= t1.reb) p2Pros.push("Мощное превосходство 'больших' игроков на щитах.");
    else p2Cons.push("Уязвимость на подборах против атлетичной передней линии соперника.");

    if (t2.def > 90) p2Pros.push("Высокая плотность в защите на дуге и перехваты на линиях передач.");
    if (t2.off < 85) p2Cons.push("Сложности с набором очков при плотной персональной опеке.");

    let analysisHtml = `
      <h4>Разбор выступления команд:</h4>
      <div style="margin-bottom:6px;">
        <b style="color:var(--p1);">Игрок 1:</b><br>
        ${p1Pros.length ? `✓ ${p1Pros.join('<br>✓ ')}<br>` : ''}
        ${p1Cons.length ? `<span class="penalty-text">⚠ ${p1Cons.join('<br>⚠ ')}</span>` : ''}
      </div>
      <div>
        <b style="color:var(--p2);">Игрок 2:</b><br>
        ${p2Pros.length ? `✓ ${p2Pros.join('<br>✓ ')}<br>` : ''}
        ${p2Cons.length ? `<span class="penalty-text">⚠ ${p2Cons.join('<br>⚠ ')}</span>` : ''}
      </div>
    `;
    document.getElementById('narrativeBox').innerHTML = analysisHtml;

    // ПОЛНЫЕ ТАБЛИЦЫ СТАТИСТИКИ (BOX SCORE)
    const renderTable = (boxes, teamTitle, teamColor, totals) => {
      let rows = boxes.map(b => `
        <tr>
          <td><b>${b.player.assignedPos}</b> ${b.player.name} <span style="font-size:0.65rem; color:#94a3b8;">(${b.player.ovr})</span></td>
          <td><b>${b.pts}</b></td>
          <td>${b.reb}</td>
          <td>${b.ast}</td>
          <td>${b.stl}</td>
          <td>${b.blk}</td>
        </tr>
      `).join('');

      return `
        <div class="team-box-header" style="color:${teamColor};">
          <span>${teamTitle} (2K OVR: ${totals.ovr} | КПД: ${totals.per.toFixed(1)})</span>
          ${totals.pen > 0 ? `<span class="penalty-text">Штраф: -${totals.pen} очк.</span>` : '<span style="color:var(--badge-fit);">Штраф: 0</span>'}
        </div>
        <table class="box-score-table">
          <tr><th>Игрок</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr>
          ${rows}
        </table>
      `;
    };

    document.getElementById('detailedBoxScores').innerHTML = `
      ${renderTable(b1, "Команда 1 (Игрок 1)", "var(--p1)", t1)}
      ${renderTable(b2, "Команда 2 (Игрок 2)", "var(--p2)", t2)}
    `;

    document.getElementById('finishModal').classList.add('active');
  }
}

const game = new FullMatchEngine();
</script>
</body>
</html>
