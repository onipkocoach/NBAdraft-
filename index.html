<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NBA $20 Squad Builder: Advanced Simulation</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --p1: #38bdf8;
      --p2: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #223049;
      --badge-fit: #10b981;
      --badge-penalty: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 14px; }
    
    header { text-align: center; }
    h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.5px; }
    .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; border: 1px solid var(--border); }

    /* Draft Card */
    .draft-box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .player-card {
      width: 100%;
      background: #090f1f;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 16px;
    }
    .player-name { font-size: 1.35rem; font-weight: 800; }
    .player-meta { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .meta-tag { background: #1a253c; padding: 3px 8px; border-radius: 6px; font-weight: 600; color: #cbd5e1; }

    .bid-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-p1 { background: var(--p1); color: #082f49; }
    .btn-p2 { background: var(--p2); color: #500724; }
    .btn-skip { background: #334155; }

    /* Rosters */
    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-card { border-top: 4px solid var(--border); }
    .team-card.p1 { border-color: var(--p1); }
    .team-card.p2 { border-color: var(--p2); }
    
    .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .team-title { font-weight: 700; font-size: 0.95rem; }
    .budget-tag { font-size: 0.8rem; background: #000; padding: 3px 7px; border-radius: 6px; font-weight: 700; }

    .slot-list { display: flex; flex-direction: column; gap: 6px; }
    .slot {
      background: #090f1f;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }
    .slot-pos { font-weight: 800; color: var(--text-muted); width: 26px; }
    .slot-info { display: flex; flex-direction: column; align-items: flex-end; max-width: 80%; }
    .slot-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-fit { font-size: 0.68rem; margin-top: 2px; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .pos-btn-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .pos-btn { padding: 12px 0; text-align: center; font-size: 0.85rem; }
    .pos-penalty-hint { font-size: 0.65rem; display: block; font-weight: normal; opacity: 0.8; margin-top: 2px; }

    /* Simulation Results */
    .score-banner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #090f1f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0;
    }
    .score-box { text-align: center; }
    .score-num { font-size: 2.2rem; font-weight: 900; }
    .score-p1 { color: var(--p1); }
    .score-p2 { color: var(--p2); }

    .breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
    .breakdown-table th, .breakdown-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .breakdown-table th { color: var(--text-muted); text-align: left; }
    .penalty-text { color: var(--badge-penalty); font-weight: 700; }
    .fit-text { color: var(--badge-fit); font-weight: 700; }

    .narrative {
      background: #090f1f;
      border-left: 3px solid var(--accent);
      padding: 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏀 NBA $20 DRAFT SIMULATOR</h1>

</div>

<script>
// Расширенная база: Рейтинг 2K, Атака (OFF), Защита (DEF), Подборы (REB), Плеймейкинг (PLAY), КПД (PER)
const PLAYERS = [

  { name: "Brook Lopez", pos: "C", sec: [], ovr: 81, off: 77, def: 90, reb: 78, play: 55, per: 15.4 },
  { name: "Alex Caruso", pos: "SG", sec: ["PG"], ovr: 81, off: 73, def: 94, reb: 62, play: 75, per: 14.8 },
  { name: "Klay Thompson", pos: "SG", sec: ["SF"], ovr: 80, off: 82, def: 74, reb: 58, play: 65, per: 13.9 }
];

const POSITIONS = ["PG", "SG", "SF", "PF", "C"];

// Дистанция штрафа за позицию (out of position)
function calculatePositionFit(player, targetPos) {
  if (player.pos === targetPos) {
    return { status: "PERFECT", penalty: 0, text: "Родная позиция (+3% химия)" };
  }
  if (player.sec && player.sec.includes(targetPos)) {
    return { status: "SECONDARY", penalty: 3, text: "Вторая позиция (-3 к очкам)" };
  }
  // Сильное несоответствие позиций
  const posOrder = { PG: 1, SG: 2, SF: 3, PF: 4, C: 5 };
  const diff = Math.abs(posOrder[player.pos] - posOrder[targetPos]);
  const penalty = diff * 5; // Чем сильнее разброс (например PG на C = 4*5 = -20)
  return { status: "OUT_OF_POS", penalty, text: `Чужая позиция (-${penalty} штраф за габариты/роль)` };
}

class AdvancedGameEngine {
  constructor() {
    this.deck = [...PLAYERS].sort(() => Math.random() - 0.5);
    this.currentPlayer = null;
    this.p1 = { budget: 20, roster: { PG: null, SG: null, SF: null, PF: null, C: null } };
    this.p2 = { budget: 20, roster: { PG: null, SG: null, SF: null, PF: null, C: null } };
    this.buyerPending = null;
    this.initSlots();
  }

  initSlots() {
    ['p1', 'p2'].forEach(p => {
      const container = document.getElementById(`${p}Slots`);
      container.innerHTML = '';
      POSITIONS.forEach(pos => {
        container.innerHTML += `
          <div class="slot" id="${p}_${pos}">
            <span class="slot-pos">${pos}</span>
            <div class="slot-info">
              <span class="slot-name">- свободно -</span>
              <span class="slot-fit"></span>
            </div>
          </div>`;
      });
    });
  }

  isTeamFull(playerNum) {
    const r = playerNum === 1 ? this.p1.roster : this.p2.roster;
    return Object.values(r).every(x => x !== null);
  }

  nextTurn() {
    if (this.isTeamFull(1) && this.isTeamFull(2)) {
      this.simulateMatch();
      return;
    }

    if (this.deck.length === 0) {
      alert("Колода игроков закончилась!");
      this.simulateMatch();
      return;
    }

    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('actionControls').style.display = 'flex';

    this.currentPlayer = this.deck.pop();
    document.getElementById('currentName').innerText = this.currentPlayer.name;
    
    const secondaries = this.currentPlayer.sec.length ? ` / ${this.currentPlayer.sec.join('/')}` : '';
    document.getElementById('currentMeta').innerHTML = `
      <span class="meta-tag">Позиция: ${this.currentPlayer.pos}${secondaries}</span>
      <span class="meta-tag">2K OVR: ${this.currentPlayer.ovr}</span>
      <span class="meta-tag">КПД (PER): ${this.currentPlayer.per}</span>
    `;
  }

  skipPlayer() {
    this.nextTurn();
  }

  buyPlayer(playerNum) {
    const cost = parseInt(document.getElementById('bidAmount').value) || 1;
    const team = playerNum === 1 ? this.p1 : this.p2;

    if (this.isTeamFull(playerNum)) {
      alert(`У Игрока ${playerNum} уже полностью набрана стартовая пятерка!`);
      return;
    }
    if (team.budget < cost) {
      alert(`Не хватает бюджета! Доступно всего: $${team.budget}`);
      return;
    }

    team.budget -= cost;
    document.getElementById(`p${playerNum}Budget`).innerText = `$${team.budget}`;

    this.buyerPending = { playerNum, cost };
    this.openPositionModal(playerNum);
  }

  openPositionModal(playerNum) {
    const roster = playerNum === 1 ? this.p1.roster : this.p2.roster;
    const container = document.getElementById('posButtons');
    container.innerHTML = '';

    document.getElementById('posPromptPlayer').innerText = 
      `${this.currentPlayer.name} (Основная: ${this.currentPlayer.pos})`;

    POSITIONS.forEach(pos => {
      const isOccupied = roster[pos] !== null;
      const fit = calculatePositionFit(this.currentPlayer, pos);

      const btn = document.createElement('button');
      btn.className = 'pos-btn';
      btn.disabled = isOccupied;
      
      let badge = fit.penalty === 0 ? "★ Родная" : `-${fit.penalty} штраф`;
      btn.innerHTML = `<b>${pos}</b><span class="pos-penalty-hint">${badge}</span>`;
      btn.onclick = () => this.assignPosition(pos, fit);
      container.appendChild(btn);
    });

    document.getElementById('posModal').classList.add('active');
  }

  assignPosition(pos, fit) {
    const { playerNum } = this.buyerPending;
    const roster = playerNum === 1 ? this.p1.roster : this.p2.roster;
    
    roster[pos] = {
      ...this.currentPlayer,
      fitPenalty: fit.penalty,
      fitStatus: fit.status,
      assignedPos: pos
    };
    
    const slotEl = document.querySelector(`#p${playerNum}_${pos}`);
    const nameEl = slotEl.querySelector('.slot-name');
    const fitEl = slotEl.querySelector('.slot-fit');

    nameEl.innerText = this.currentPlayer.name;
    nameEl.style.color = '#38bdf8';

    if (fit.penalty === 0) {
      fitEl.innerText = "✓ Идеально";
      fitEl.style.color = "var(--badge-fit)";
    } else {
      fitEl.innerText = `⚠ Штраф: -${fit.penalty}`;
      fitEl.style.color = "var(--badge-penalty)";
    }

    document.getElementById('posModal').classList.remove('active');
    this.nextTurn();
  }

  // Расчёт метрик, КПД, синергии и симуляция реального баскетбольного счета
  simulateMatch() {
    const calcTeamStats = (roster) => {
      let totalOvr = 0;
      let totalOff = 0;
      let totalDef = 0;
      let totalReb = 0;
      let totalPlay = 0;
      let totalPer = 0;
      let totalPenalties = 0;

      POSITIONS.forEach(pos => {
        const p = roster[pos];
        if (p) {
          totalOvr += p.ovr;
          totalOff += p.off;
          totalDef += p.def;
          totalReb += p.reb;
          totalPlay += p.play;
          totalPer += p.per;
          totalPenalties += p.fitPenalty;
        }
      });

      // Базовые очки генерируются на основе Атаки vs Защиты соперника + КПД (PER)
      return { totalOvr, totalOff, totalDef, totalReb, totalPlay, totalPer, totalPenalties };
    };

    const t1 = calcTeamStats(this.p1.roster);
    const t2 = calcTeamStats(this.p2.roster);

    // Подсчет результативности (Счёт матча NBA ~ 90-130 очков)
    // База атаки команды против обороны оппонента:
    let p1Score = 100 + (t1.totalOff / 5 - 85) * 1.4 - (t2.totalDef / 5 - 85) * 0.9 + (t1.totalPlay / 5 - 80) * 0.5;
    let p2Score = 100 + (t2.totalOff / 5 - 85) * 1.4 - (t1.totalDef / 5 - 85) * 0.9 + (t2.totalPlay / 5 - 80) * 0.5;

    // Влияние борьбы на щитах (REB): преимущество даёт вторые шансы
    const rebDiff = (t1.totalReb - t2.totalReb) / 5;
    p1Score += rebDiff * 0.8;
    p2Score -= rebDiff * 0.8;

    // Влияние штрафов за позицию (out of position разрушает структуру игры)
    p1Score -= t1.totalPenalties * 0.9;
    p2Score -= t2.totalPenalties * 0.9;

    // Округление счета
    let final1 = Math.round(p1Score);
    let final2 = Math.round(p2Score);
    if (final1 === final2) final1 += 1; // Без ничьих в плей-офф

    document.getElementById('p1Points').innerText = final1;
    document.getElementById('p2Points').innerText = final2;

    // Генерируем аналитическое заключение матча
    let narratives = [];
    if (t1.totalPenalties > 10) narratives.push("❌ У Игрока 1 возник хаос из-за игроков не на своих позициях.");
    if (t2.totalPenalties > 10) narratives.push("❌ Игрок 2 пострадал от дисбаланса ростера и штрафов за габариты.");
    
    if (t1.totalReb > t2.totalReb + 15) narratives.push("🔥 Игрок 1 полностью вычистил щиты за счёт превосходства подборов.");
    else if (t2.totalReb > t1.totalReb + 15) narratives.push("🔥 Игрок 2 разгромил соперника вторыми шансами под кольцом.");

    if (t1.totalDef > t2.totalDef + 10) narratives.push("🛡️ Железобетонная оборона Команды 1 задушила звёзд оппонента.");
    else if (t2.totalDef > t1.totalDef + 10) narratives.push("🛡️ Элитный периметровый прессинг Команды 2 решил исход клатча.");

    if (narratives.length === 0) {
      narratives.push("⚡ Матч равных возможностей: исход решило индивидуальное мастерство лидеров и КПД в концовке.");
    }

    document.getElementById('narrativeBox').innerHTML = `<b>Аналитика матча:</b><br>${narratives.join('<br>')}`;

    // Таблица детализации
    let table = `
      <table class="breakdown-table">
        <tr><th>Метрика</th><th>Игрок 1</th><th>Игрок 2</th></tr>
        <tr><td>Суммарный 2K OVR</td><td><b>${t1.totalOvr}</b></td><td><b>${t2.totalOvr}</b></td></tr>
        <tr><td>Суммарный КПД (PER)</td><td>${t1.totalPer.toFixed(1)}</td><td>${t2.totalPer.toFixed(1)}</td></tr>
        <tr><td>Атака / Защита (OFF / DEF)</td><td>${Math.round(t1.totalOff/5)} / ${Math.round(t1.totalDef/5)}</td><td>${Math.round(t2.totalOff/5)} / ${Math.round(t2.totalDef/5)}</td></tr>
        <tr><td>Подборы (REB AVG)</td><td>${Math.round(t1.totalReb/5)}</td><td>${Math.round(t2.totalReb/5)}</td></tr>
        <tr><td>Штрафы за позицию</td><td class="penalty-text">-${t1.totalPenalties} очк.</td><td class="penalty-text">-${t2.totalPenalties} очк.</td></tr>
      </table>
    `;

    document.getElementById('boxScores').innerHTML = table;
    document.getElementById('finishModal').classList.add('active');
  }
}

const game = new AdvancedGameEngine();
</script>
