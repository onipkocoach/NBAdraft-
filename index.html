<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NBA All-Time $20 Squad Builder</title>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: #111a2e;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --p1: #38bdf8;
      --p2: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --badge-fit: #10b981;
      --badge-penalty: #ef4444;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 12px; }
    
    header { text-align: center; }
    h1 { font-size: 1.35rem; color: var(--accent); letter-spacing: 0.5px; }
    .subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; border: 1px solid var(--border); }

    /* Драфт-зона */
    .draft-box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .player-card {
      width: 100%;
      background: #090e1c;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 16px;
    }
    .player-name { font-size: 1.35rem; font-weight: 800; }
    .player-meta { color: var(--text-muted); font-size: 0.82rem; margin-top: 6px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .meta-tag { background: #1a253c; padding: 4px 8px; border-radius: 6px; font-weight: 600; color: #cbd5e1; }
    .meta-era-legend { background: #78350f; color: #fef08a; border: 1px solid #b45309; }
    .meta-era-modern { background: #1e3a5f; color: #93c5fd; border: 1px solid #2563eb; }

    .skip-counter {
      font-size: 0.75rem;
      color: #fb7185;
      font-weight: 600;
      background: #2b0b17;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #881337;
    }

    .bid-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-p1 { background: var(--p1); color: #082f49; }
    .btn-p2 { background: var(--p2); color: #500724; }
    .btn-skip { background: #334155; }

    /* Ростеры */
    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-card { border-top: 4px solid var(--border); }
    .team-card.p1 { border-color: var(--p1); }
    .team-card.p2 { border-color: var(--p2); }
    
    .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .team-title { font-weight: 700; font-size: 0.95rem; }
    .budget-tag { font-size: 0.8rem; background: #000; padding: 3px 7px; border-radius: 6px; font-weight: 700; }

    .slot-list { display: flex; flex-direction: column; gap: 6px; }
    .slot {
      background: #090e1c;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }
    .slot-pos { font-weight: 800; color: var(--text-muted); width: 24px; }
    .slot-info { display: flex; flex-direction: column; align-items: flex-end; max-width: 82%; }
    .slot-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-fit { font-size: 0.65rem; margin-top: 2px; }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .pos-btn-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .pos-btn { padding: 12px 0; text-align: center; font-size: 0.85rem; }
    .pos-penalty-hint { font-size: 0.62rem; display: block; font-weight: normal; opacity: 0.8; margin-top: 2px; }

    /* Результаты матча */
    .score-banner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #090e1c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .score-box { text-align: center; }
    .score-num { font-size: 2.2rem; font-weight: 900; }
    .score-p1 { color: var(--p1); }
    .score-p2 { color: var(--p2); }

    .breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.74rem; margin-top: 8px; }
    .breakdown-table th, .breakdown-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); }
    .breakdown-table th { color: var(--text-muted); text-align: left; }
    .penalty-text { color: var(--badge-penalty); font-weight: 700; }

    .narrative {
      background: #090e1c;
      border-left: 3px solid var(--accent);
      padding: 10px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #cbd5e1;
      border-radius: 4px;
    }
    .mvp-banner {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      background: #2b1f09;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #78350f;
    }
  </style>
</head>

<div class="container">
  <header>
    <h1>🏀 ALL-TIME NBA $20 DRAFT</h1>
    <p class="subtitle">Легенды и современные звезды • Скрытые рейтинги 2K • Лимит на сбросы • Симуляция матча</p>
  </header>

  <!-- ДРАФТ-ЗОНА -->
  <section class="card draft-box" id="draftBox">
    <div class="player-card">
      <div class="player-name" id="currentName">Нажмите «Начать драфт»</div>
      <div class="player-meta" id="currentMeta">
        <span class="meta-tag">В колоде 120+ величайших игроков</span>
      </div>
    </div>

    <div>
      <span class="skip-counter" id="skipCounterDisplay">Сбросов осталось: 4 / 4</span>
    </div>
    
    <div class="bid-controls" id="controls">
      <button id="startBtn" onclick="game.nextTurn()">Начать драфт</button>
      <div id="actionControls" style="display:none; width: 100%; flex-direction: column; gap: 8px; align-items: center;">
        <label style="font-size: 0.85rem;">Ставка ($): 
          <input type="number" id="bidAmount" value="1" min="1" max="20" style="width: 55px; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: #090e1c; color: #fff; text-align: center; font-weight: 700;">
        </label>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button class="btn-p1" onclick="game.buyPlayer(1)">Купить Игрок 1</button>
          <button class="btn-p2" onclick="game.buyPlayer(2)">Купить Игрок 2</button>
          <button class="btn-skip" id="skipBtn" onclick="game.skipPlayer()">Сброс игрока</button>
        </div>
      </div>
    </div>
  </section>

  <!-- РОСТЕРЫ КОМАНД -->
  <section class="teams-grid">
    <div class="card team-card p1">
      <div class="team-header">
        <span class="team-title" style="color:var(--p1)">Игрок 1</span>
        <span class="budget-tag" id="p1Budget">$20</span>
      </div>
      <div class="slot-list" id="p1Slots"></div>
    </div>

    <div class="card team-card p2">
      <div class="team-header">
        <span class="team-title" style="color:var(--p2)">Игрок 2</span>
        <span class="budget-tag" id="p2Budget">$20</span>
      </div>
      <div class="slot-list" id="p2Slots"></div>
    </div>
  </section>
</div>

<!-- МОДАЛ ВЫБОРА ПОЗИЦИИ -->
<div class="modal" id="posModal">
  <div class="modal-content">
    <h3 style="font-size:1.05rem;">Выберите позицию в пятерке</h3>
    <p style="font-size: 0.8rem; color: var(--text-muted);" id="posPromptPlayer"></p>
    <div class="pos-btn-group" id="posButtons"></div>
  </div>
</div>

<!-- МОДАЛ ФИНАЛА И ИТОГОВ МАТЧА -->
<div class="modal" id="finishModal">
  <div class="modal-content">
    <h2 style="text-align: center; font-size: 1.2rem;">ФИНАЛЬНЫЙ СЧЁТ И СИМУЛЯЦИЯ</h2>
    
    <div class="score-banner">
      <div class="score-box">
        <div style="font-weight: 700; color: var(--p1); font-size: 0.85rem;">Игрок 1</div>
        <div class="score-num score-p1" id="p1Points">0</div>
      </div>
      <div style="font-size: 1.2rem; font-weight: 900; color: var(--text-muted);">VS</div>
      <div class="score-box">
        <div style="font-weight: 700; color: var(--p2); font-size: 0.85rem;">Игрок 2</div>
        <div class="score-num score-p2" id="p2Points">0</div>
      </div>
    </div>

    <div class="mvp-banner" id="mvpBanner"></div>
    <div id="narrativeBox" class="narrative"></div>
    <div id="boxScores"></div>

    <button onclick="location.reload()" style="margin-top: 8px; width: 100%;">Сыграть заново</button>
  </div>
</div>

const POSITIONS = ["PG", "SG", "SF", "PF", "C"];

function calculateFit(player, targetPos) {
  if (player.pos === targetPos) {
    return { status: "PERFECT", penalty: 0, text: "Родная позиция (100% полезность)" };
  }
  if (player.sec && player.sec.includes(targetPos)) {
    return { status: "SECONDARY", penalty: 3, text: "Вторая позиция (-3 очка)" };
  }
  const posOrder = { PG: 1, SG: 2, SF: 3, PF: 4, C: 5 };
  const diff = Math.abs(posOrder[player.pos] - posOrder[targetPos]);
  const penalty = diff * 5; 
  return { status: "OUT_OF_POS", penalty, text: `Чужая позиция (-${penalty} штраф)` };
}

class AllTimeDraftGame {
  constructor() {
    this.deck = [...ALL_PLAYERS].sort(() => Math.random() - 0.5);
    this.currentPlayer = null;
    this.skipsLeft = 4;
    this.p1 = { budget: 20, roster: { PG: null, SG: null, SF: null, PF: null, C: null } };
    this.p2 = { budget: 20, roster: { PG: null, SG: null, SF: null, PF: null, C: null } };
    this.buyerPending = null;
    this.initSlots();
    this.updateSkipUI();
  }

  initSlots() {
    ['p1', 'p2'].forEach(p => {
      const container = document.getElementById(`${p}Slots`);
      container.innerHTML = '';
      POSITIONS.forEach(pos => {
        container.innerHTML += `
          <div class="slot" id="${p}_${pos}">
            <span class="slot-pos">${pos}</span>
            <div class="slot-info">
              <span class="slot-name">- пусто -</span>
              <span class="slot-fit"></span>
            </div>
          </div>`;
      });
    });
  }

  updateSkipUI() {
    const disp = document.getElementById('skipCounterDisplay');
    const btn = document.getElementById('skipBtn');
    disp.innerText = `Сбросов осталось: ${this.skipsLeft} / 4`;
    if (this.skipsLeft <= 0) {
      if (btn) btn.disabled = true;
      disp.style.color = '#ef4444';
      disp.innerText = `Сбросов не осталось (0 / 4)`;
    }
  }

  isTeamFull(playerNum) {
    const r = playerNum === 1 ? this.p1.roster : this.p2.roster;
    return Object.values(r).every(x => x !== null);
  }

  nextTurn() {
    if (this.isTeamFull(1) && this.isTeamFull(2)) {
      this.simulateMatch();
      return;
    }

    if (this.deck.length === 0) {
      alert("Все игроки разобраны!");
      this.simulateMatch();
      return;
    }

    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('actionControls').style.display = 'flex';

    this.currentPlayer = this.deck.pop();
    document.getElementById('currentName').innerText = this.currentPlayer.name;
    
    const eraClass = this.currentPlayer.era === 'legend' ? 'meta-era-legend' : 'meta-era-modern';
    const eraText = this.currentPlayer.era === 'legend' ? '⭐ Легенда NBA' : '🔥 Действующая звезда';
    const secondaries = this.currentPlayer.sec.length ? ` / ${this.currentPlayer.sec.join('/')}` : '';

    // Рейтинги 2K и КПД полностью СКРЫТЫ во время драфта
    document.getElementById('currentMeta').innerHTML = `
      <span class="meta-tag ${eraClass}">${eraText}</span>
      <span class="meta-tag">Позиция: ${this.currentPlayer.pos}${secondaries}</span>
      <span class="meta-tag" style="background:#221526; color:#e9d5ff;">2K OVR: 🔒 Скрыто</span>
    `;
  }

  skipPlayer() {
    if (this.skipsLeft <= 0) {
      alert("Лимит сбросов исчерпан (максимум 4 за игру)!");
      return;
    }
    this.skipsLeft--;
    this.updateSkipUI();
    this.nextTurn();
  }

  buyPlayer(playerNum) {
    const cost = parseInt(document.getElementById('bidAmount').value) || 1;
    const team = playerNum === 1 ? this.p1 : this.p2;

    if (this.isTeamFull(playerNum)) {
      alert(`У Игрока ${playerNum} уже полностью укомплектована стартовая пятерка!`);
      return;
    }
    if (team.budget < cost) {
      alert(`Не хватает бюджета! Доступно: $${team.budget}`);
      return;
    }

    team.budget -= cost;
    document.getElementById(`p${playerNum}Budget`).innerText = `$${team.budget}`;

    this.buyerPending = { playerNum, cost };
    this.openPositionModal(playerNum);
  }

  openPositionModal(playerNum) {
    const roster = playerNum === 1 ? this.p1.roster : this.p2.roster;
    const container = document.getElementById('posButtons');
    container.innerHTML = '';

    document.getElementById('posPromptPlayer').innerText = 
      `${this.currentPlayer.name} (Основная: ${this.currentPlayer.pos})`;

    POSITIONS.forEach(pos => {
      const isOccupied = roster[pos] !== null;
      const fit = calculateFit(this.currentPlayer, pos);

      const btn = document.createElement('button');
      btn.className = 'pos-btn';
      btn.disabled = isOccupied;
      
      let badge = fit.penalty === 0 ? "★ Родная" : `-${fit.penalty} штраф`;
      btn.innerHTML = `<b>${pos}</b><span class="pos-penalty-hint">${badge}</span>`;
      btn.onclick = () => this.assignPosition(pos, fit);
      container.appendChild(btn);
    });

    document.getElementById('posModal').classList.add('active');
  }

  assignPosition(pos, fit) {
    const { playerNum } = this.buyerPending;
    const roster = playerNum === 1 ? this.p1.roster : this.p2.roster;
    
    roster[pos] = {
      ...this.currentPlayer,
      fitPenalty: fit.penalty,
      fitStatus: fit.status,
      assignedPos: pos
    };
    
    const slotEl = document.querySelector(`#p${playerNum}_${pos}`);
    const nameEl = slotEl.querySelector('.slot-name');
    const fitEl = slotEl.querySelector('.slot-fit');

    nameEl.innerText = this.currentPlayer.name;
    nameEl.style.color = '#38bdf8';

    if (fit.penalty === 0) {
      fitEl.innerText = "✓ Идеально";
      fitEl.style.color = "var(--badge-fit)";
    } else {
      fitEl.innerText = `⚠ Штраф: -${fit.penalty}`;
      fitEl.style.color = "var(--badge-penalty)";
    }

    document.getElementById('posModal').classList.remove('active');
    this.nextTurn();
  }

  simulateMatch() {
    const getTeamData = (roster) => {
      let totalOvr = 0, totalOff = 0, totalDef = 0, totalReb = 0, totalPlay = 0, totalPer = 0, totalPen = 0;
      let playersList = [];

      POSITIONS.forEach(pos => {
        const p = roster[pos];
        if (p) {
          totalOvr += p.ovr;
          totalOff += p.off;
          totalDef += p.def;
          totalReb += p.reb;
          totalPlay += p.play;
          totalPer += p.per;
          totalPen += p.fitPenalty;
          playersList.push(p);
        }
      });
      return { totalOvr, totalOff, totalDef, totalReb, totalPlay, totalPer, totalPen, playersList };
    };

    const t1 = getTeamData(this.p1.roster);
    const t2 = getTeamData(this.p2.roster);

    // Базовый расчет счета матча NBA
    let p1Score = 102 + (t1.totalOff / 5 - 85) * 1.3 - (t2.totalDef / 5 - 85) * 0.85 + (t1.totalPlay / 5 - 75) * 0.4;
    let p2Score = 102 + (t2.totalOff / 5 - 85) * 1.3 - (t1.totalDef / 5 - 85) * 0.85 + (t2.totalPlay / 5 - 75) * 0.4;

    // Влияние борьбы на щитах
    const rebDiff = (t1.totalReb - t2.totalReb) / 5;
    p1Score += rebDiff * 0.7;
    p2Score -= rebDiff * 0.7;

    // Влияние штрафов за позицию (out of position разрушает синергию)
    p1Score -= t1.totalPen * 0.85;
    p2Score -= t2.totalPen * 0.85;

    let final1 = Math.round(p1Score);
    let final2 = Math.round(p2Score);
    if (final1 === final2) final1 += 1;

    document.getElementById('p1Points').innerText = final1;
    document.getElementById('p2Points').innerText = final2;

    // Определение лучшего игрока матча (MVP)
    const allDrafted = [...t1.playersList, ...t2.playersList];
    allDrafted.sort((a, b) => (b.per + b.ovr * 0.2) - (a.per + a.ovr * 0.2));
    const mvp = allDrafted[0];
    document.getElementById('mvpBanner').innerText = `⭐ MVP МАТЧА: ${mvp.name} (2K: ${mvp.ovr} | КПД: ${mvp.per})`;

    // Аналитическое заключение
    let narratives = [];
    if (t1.totalPen > 12) narratives.push("❌ Игрок 1 пострадал из-за сильного нарушения ролей и игры не на своих позициях.");
    if (t2.totalPen > 12) narratives.push("❌ Игрок 2 потерял ритм из-за провалов в габаритах и чужих позиций.");
    
    if (t1.totalReb > t2.totalReb + 12) narratives.push("🏀 Команда 1 тотально забрала подборы под обоими щитами.");
    else if (t2.totalReb > t1.totalReb + 12) narratives.push("🏀 Команда 2 доминировала в трехсекундной зоне и на втором темпе.");

    if (t1.totalDef > t2.totalDef + 8) narratives.push("🛡️ Элитная опека Команды 1 выбила лидеров соперника из комфортной зоны.");
    else if (t2.totalDef > t1.totalDef + 8) narratives.push("🛡️ Плотный защитный заслон Команды 2 заставил соперника совершать сложные броски.");

    if (narratives.length === 0) {
      narratives.push("⚡ Упорнейший матч легенд: разницу сделали хладнокровие в клатче и индивидуальный КПД.");
    }
    document.getElementById('narrativeBox').innerHTML = `<b>Разбор симулятора:</b><br>${narratives.join('<br>')}`;

    // Подробный бокс-скор с раскрытыми рейтингами
    let table = `
      <table class="breakdown-table">
        <tr><th>Поз</th><th>Игрок 1 (2K / КПД)</th><th>Игрок 2 (2K / КПД)</th></tr>
    `;

    POSITIONS.forEach(pos => {
      const p1P = this.p1.roster[pos];
      const p2P = this.p2.roster[pos];
      const p1Info = p1P ? `${p1P.name} (<b>${p1P.ovr}</b> / ${p1P.per})` : '-';
      const p2Info = p2P ? `${p2P.name} (<b>${p2P.ovr}</b> / ${p2P.per})` : '-';
      table += `<tr><td><b>${pos}</b></td><td>${p1Info}</td><td>${p2Info}</td></tr>`;
    });

    table += `
      <tr style="background:#090e1c; font-weight:700;">
        <td>ИТОГ</td>
        <td>OVR: ${t1.totalOvr} | КПД: ${t1.totalPer.toFixed(1)}</td>
        <td>OVR: ${t2.totalOvr} | КПД: ${t2.totalPer.toFixed(1)}</td>
      </tr>
      <tr>
        <td>Штрафы</td>
        <td class="penalty-text">-${t1.totalPen} очк.</td>
        <td class="penalty-text">-${t2.totalPen} очк.</td>
      </tr>
    </table>`;

    document.getElementById('boxScores').innerHTML = table;
    document.getElementById('finishModal').classList.add('active');
  }
}
